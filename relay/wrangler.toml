# The bug report relay. Deploying: see README.md.
name = "maelstrom"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The relay answers at one public address, the one the game knows. Preview
# URLs would give every deployed version its own guessable address as well.
workers_dev = true
preview_urls = false

# Not secret: it ends up in the public repository anyway.
# The Discord webhook URL is a secret: set it in the dashboard (Settings >
# Variables and Secrets, type Secret) or with `wrangler secret put
# DISCORD_WEBHOOK_URL`, never here.
[vars]
REPORT_TTL_DAYS = "180"         # then KV deletes the report and its screenshot

# A copy of every report, and the screenshots the issues link to.
# Create the "maelstrom-reports" namespace and paste its id here: see README.md.
[[kv_namespaces]]
binding = "REPORTS"
id = "REPLACE_WITH_THE_NAMESPACE_ID"

# At most 5 reports a minute from the same address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
