# Construction web (pygbag). Lu depuis le dossier courant : lancer la commande
# DEPUIS ce dossier (`cd maelstrom && pygbag --build .`), sinon le fichier
# n'est pas trouve et tout part dans l'archive.
#
# On retire la documentation et ce fichier meme : le navigateur n'en a pas
# besoin. La licence de la police, elle, RESTE dans l'archive : elle accompagne
# le fichier .ttf qu'on redistribue.
[DEPENDENCIES]
ignoreDirs = ["saves", "tools", "attic"]
ignoreFiles = ["CLAUDE.md", "pygbag.ini"]
